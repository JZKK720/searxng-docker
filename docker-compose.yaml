services:
  caddy:
    container_name: caddy
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - searxng
    networks:
      - searxng
    volumes:
      - ./caddy:/etc/caddy:ro
      - ./caddy/data:/data:rw
      - ./caddy/config:/config:rw
    ports:
      - "3443:443"
      - "8443:80"
      - "443:443"
      - "80:80"
    
    environment:
      - SEARXNG_HOSTNAME=isearxng.cubecloud.io
      - SEARXNG_TLS=
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

  redis:
    container_name: redis
    image: docker.io/valkey/valkey:8-alpine
    command: valkey-server --save 30 1 --loglevel warning
    restart: unless-stopped
    networks:
      - searxng
    volumes:
      - ./valkey/data:/data
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

  searxng:
    container_name: searxng
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    networks:
      - searxng
    ports:
      - "8334:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
      - ./searxng/cache:/var/cache/searxng:rw
    environment:
      - SEARXNG_HOSTNAME=isearxng.cubecloud.io
      - SEARXNG_BASE_URL=https://isearxng.cubecloud.io/
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

networks:
  searxng:
 
